[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-belegerfassung"
version = "0.1.0"
description = "Eingangsrechnungen mit Claude auslesen, automatisch prüfen und nach Excel exportieren"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.14",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
belege = "belegerfassung.cli:main"

[tool.setuptools]
packages = ["belegerfassung"]

[tool.setuptools.package-data]
belegerfassung = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
